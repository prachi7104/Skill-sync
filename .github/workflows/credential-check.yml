name: Credential check

# Blocks credential-like values in tracked files. Output lists file:line and rule only.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  credential-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credential-like values
        run: node scripts/check-committed-credentials.mjs
